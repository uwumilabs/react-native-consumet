name: Turborepo cache
description: Restore the turborepo cache (the job's TURBO_CACHE_DIR) of the example app's build:<platform> task, and set turbo_cache_hit=1 when that task is cached

inputs:
  platform:
    description: android or ios
    required: true

runs:
  using: composite
  steps:
    - name: Cache turborepo for ${{ inputs.platform }}
      uses: actions/cache@v4
      with:
        path: ${{ env.TURBO_CACHE_DIR }}
        key: ${{ runner.os }}-turborepo-${{ inputs.platform }}-${{ hashFiles('yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-turborepo-${{ inputs.platform }}-

    - name: Check turborepo cache for ${{ inputs.platform }}
      shell: bash
      env:
        TASK: build:${{ inputs.platform }}
      run: |
        TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run "$TASK" --cache-dir="$TURBO_CACHE_DIR" --dry=json)).tasks.find(t => t.task === '$TASK').cache.status")

        if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
          echo "turbo_cache_hit=1" >> $GITHUB_ENV
        fi
