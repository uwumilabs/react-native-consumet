name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      # Plain `eslint .` (no --fix), so problems fail the job instead of being rewritten away.
      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      # The offline unit tests (test/unit/); the live suites call real sites and stay manual.
      - name: Run unit tests
        run: yarn test

  # dist/ and registry/ are committed; check both against a clean rebuild of the sources.
  registry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Release tags are needed to read each supported release's bundled registry, and the
          # base commit to compare registry versions against.
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Rebuild dist
        id: rebuild
        run: yarn build:clean

      - name: Check the committed dist matches the rebuild
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --short -- dist
            echo "::error::dist/ differs from a clean rebuild of the sources. Commit through the pre-commit hook, or run yarn build:clean and yarn build:registry, and commit dist/, registry/, src/extension-registry.json and apps/src/registry/local-dist-map.ts."
            exit 1
          fi

      # Fails if a registry hash differs from its rebuilt bundle, a hash changed without a version
      # bump, a published file changed, a referenced published file is missing, or the example
      # app's local dist map is out of date.
      - name: Check registry entries against the rebuild and the base commit
        if: ${{ !cancelled() && steps.rebuild.outcome == 'success' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: yarn registry:check --base "$BASE_SHA"

  # The rest of `yarn prepare` (bob build && yarn build): the registry job builds dist/.
  build-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn bob build

  build-android:
    runs-on: ubuntu-latest
    env:
      TURBO_CACHE_DIR: .turbo/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Turborepo cache
        uses: ./.github/actions/turbo-cache
        with:
          platform: android

      - name: Install JDK
        if: env.turbo_cache_hit != 1
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Finalize Android SDK
        if: env.turbo_cache_hit != 1
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Cache Gradle
        if: env.turbo_cache_hit != 1
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradle wrapper executable
        if: env.turbo_cache_hit != 1
        run: chmod +x apps/android/gradlew

      - name: Build example for Android
        env:
          JAVA_OPTS: '-XX:MaxHeapSize=6g'
        run: |
          yarn turbo run build:android --cache-dir="${{ env.TURBO_CACHE_DIR }}"

      # The native module's JVM tests (android/src/test). Skipped with the build on a cache hit,
      # which turbo only reports while android/ and src/ are unchanged.
      - name: Run Android unit tests
        if: env.turbo_cache_hit != 1
        working-directory: apps/android
        run: ./gradlew :react-native-consumet:testDebugUnitTest --no-daemon --console=plain

  build-ios:
    runs-on: macos-latest
    env:
      TURBO_CACHE_DIR: .turbo/ios
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Turborepo cache
        uses: ./.github/actions/turbo-cache
        with:
          platform: ios

      - name: Restore cocoapods
        if: env.turbo_cache_hit != 1
        id: cocoapods-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            **/ios/Pods
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('apps/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-

      # Runs even when Pods were restored: pod install also generates the codegen sources the build
      # needs, and with restored Pods it only has to verify them.
      - name: Install cocoapods
        if: env.turbo_cache_hit != 1
        run: |
          cd apps/ios
          pod install

      - name: Cache cocoapods
        if: env.turbo_cache_hit != 1 && steps.cocoapods-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            **/ios/Pods
          key: ${{ steps.cocoapods-cache.outputs.cache-primary-key }}

      - name: Build example for iOS
        run: |
          yarn turbo run build:ios --cache-dir="${{ env.TURBO_CACHE_DIR }}"
